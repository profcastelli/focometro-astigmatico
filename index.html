<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Simulatore Focometro Torico - Prof. Castelli</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div class="main-viewport">
<div id="setup-panel">
<h1>Configurazione Esame</h1>
<div class="setup-group">
<label>Numero di lenti:</label>
<input id="total-lenses-input" min="1" type="number" value="10"/>
</div>
<div class="setup-group">
<label>Tentativi per lente:</label>
<input id="max-errors-input" min="1" type="number" value="3"/>
</div>
<button class="btn-start" onclick="startGame()">INIZIA ESAME</button>
</div>
<div class="game-layout hidden" id="game-screen">
<div class="column-left">
<div class="axis-wrap">
<div id="axis-ring" title="Usa la rotellina del mouse per ruotare l'asse">
<svg id="axis-svg" viewbox="0 0 440 440"></svg>
<div id="instrument">
<div id="mira-container">
<svg style="width:100%; height:100%; background:black; border-radius:50%;" viewbox="0 0 100 100">
<defs>
<filter id="blur-a">
<fegaussianblur id="blur-a-node" stddeviation="0"></fegaussianblur>
</filter>
<filter id="blur-b">
<fegaussianblur id="blur-b-node" stddeviation="0"></fegaussianblur>
</filter>
</defs>
<circle cx="50" cy="50" fill="none" opacity="0.5" r="15" stroke="#00ff66" stroke-width="0.5"></circle>
<circle cx="50" cy="50" fill="none" opacity="0.3" r="30" stroke="#00ff66" stroke-width="0.5"></circle>
<g filter="url(#blur-a)" id="mire-a">
<g stroke="#00ff66" stroke-dasharray="1.5,1" stroke-width="1.2">
<line x1="5" x2="95" y1="50" y2="50"></line>
<line opacity="0.8" x1="10" x2="90" y1="45" y2="45"></line>
<line opacity="0.8" x1="10" x2="90" y1="55" y2="55"></line>
</g>
</g>
<g filter="url(#blur-b)" id="mire-b">
<g stroke="#00ff66" stroke-dasharray="1.5,1" stroke-width="1.2">
<line x1="50" x2="50" y1="5" y2="95"></line>
<line opacity="0.8" x1="45" x2="45" y1="10" y2="90"></line>
<line opacity="0.8" x1="55" x2="55" y1="10" y2="90"></line>
</g>
</g>
<rect fill="none" height="10" stroke="#00ff66" stroke-width="1.2" width="10" x="45" y="45"></rect>
</svg>
</div>
</div>
</div>
<div class="axis-buttons">
<button class="btn-axis" onclick="adjustAxis(5)" title="Ruota antiorario: asse +5°">◀</button>
<button class="btn-axis" onclick="adjustAxis(-5)" title="Ruota orario: asse −5°">▶</button>
</div>
</div>
<div class="drum-layout-horizontal">
<div class="reading-window">
<div class="reading-line"></div>
<div class="drum-scale" id="drum"></div>
</div>
<div class="vertical-arrows">
<button class="btn-arrow" onclick="adjustPower(0.125)">▲</button>
<button class="btn-arrow" onclick="adjustPower(-0.125)">▼</button>
</div>
</div>
<input id="power-slider" max="25" min="-25" oninput="updateUI()" step="0.125" style="display:none" type="range" value="0"/>
</div>
<div class="column-right">
<div class="stats">
<span>Lente: <b id="current-lens-num">1</b>/<b id="total-lenses-display">10</b></span>
<span>Punti: <b id="score">0</b></span>
<span>Riprova: <b id="errors-left">0</b></span>
</div>
<div class="bottom-controls toric-controls">
<div id="feedback"></div>
<button class="hidden" id="btn-next" onclick="nextLens()">
              PROSSIMA LENTE
            </button>
<div class="answers-frame"><div class="answers-left"><div class="answer-section readings-section">
<h2>LETTURE</h2>
<div class="readings-grid">
<div class="reading-label">L1</div>
<div class="rx-field"><label>POTERE</label><input id="l1-power" onclick="selectField('l1-power')" placeholder="+0.00" readonly="" type="text"/></div>
<div class="rx-field"><label>ASSE NITIDO</label><input id="l1-axis" onclick="selectField('l1-axis')" placeholder="0" readonly="" type="text"/></div>
<div class="reading-label">L2</div>
<div class="rx-field"><label>POTERE</label><input id="l2-power" onclick="selectField('l2-power')" placeholder="+0.00" readonly="" type="text"/></div>
<div class="rx-field"><label>ASSE NITIDO</label><input id="l2-axis" onclick="selectField('l2-axis')" placeholder="0" readonly="" type="text"/></div>
</div>
</div></div><div class="answers-right"><div class="answer-section">
<h2>RICETTA</h2>
<div class="rx-grid">
<div class="rx-field">
<label>SFERA</label>
<input id="rx-sphere" onclick="selectField('rx-sphere')" placeholder="+0.00" readonly="" type="text"/>
</div>
<div class="rx-field">
<label>CILINDRO</label>
<input id="rx-cylinder" onclick="selectField('rx-cylinder')" placeholder="-0.00" readonly="" type="text"/>
</div>
<div class="rx-field">
<label>ASSE</label>
<input id="rx-axis" onclick="selectField('rx-axis')" placeholder="0" readonly="" type="text"/>
</div>
</div>
</div><div class="answer-section transpose-section">
<h2>TRASPOSTA</h2>
<div class="rx-grid">
<div class="rx-field">
<label>SFERA</label>
<input id="tr-sphere" onclick="selectField('tr-sphere')" placeholder="+0.00" readonly="" type="text"/>
</div>
<div class="rx-field">
<label>CILINDRO</label>
<input id="tr-cylinder" onclick="selectField('tr-cylinder')" placeholder="+0.00" readonly="" type="text"/>
</div>
<div class="rx-field">
<label>ASSE</label>
<input id="tr-axis" onclick="selectField('tr-axis')" placeholder="0" readonly="" type="text"/>
</div>
</div>
</div></div></div><div class="numpad">
<button onclick="appendNum('1')">1</button>
<button onclick="appendNum('2')">2</button>
<button onclick="appendNum('3')">3</button>
<button onclick="appendNum('4')">4</button>
<button onclick="appendNum('5')">5</button>
<button onclick="appendNum('6')">6</button>
<button onclick="appendNum('7')">7</button>
<button onclick="appendNum('8')">8</button>
<button onclick="appendNum('9')">9</button>
<button onclick="appendNum('-')" style="color:#ffbc00">-</button>
<button onclick="appendNum('0')">0</button>
<button onclick="appendNum('.')">.</button>
<button class="clear-btn" onclick="backspaceInput()">⌫</button>
<button class="verify-btn" id="btn-verify" onclick="checkAnswer()">INVIA</button>
</div></div>
</div>
</div>
<button class="btn-menu" onclick="backToMenu()">ESCI</button>
</div>
<footer class="credits">
      Ideatore e Programmatore: Prof. Francesco Castelli | Progetto realizzato per scopi didattici e non commerciali
    </footer>
<script src="script.js"></script>
</body>
</html>
